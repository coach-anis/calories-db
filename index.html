<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الحاسبة اليدوية | Coach Anis</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #121216;
  --card-bg: #1A1A22;
  --border: #2A2A36;
  --text: #FFFFFF;
  --text-muted: #8E8EA0;
  --accent: #FF5F1F;
  --accent-light: rgba(255, 95, 31, 0.15);
  --radius: 12px;
}

* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
body { 
  background: var(--bg); 
  color: var(--text); 
  min-height: 100vh; 
  display: flex; 
  align-items: center; 
  justify-content: center; 
  padding: 20px; 
}

.container {
  width: 100%;
  max-width: 420px;
}

.card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.3);
}

.card-title {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 18px;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}

.form-group {
  margin-bottom: 15px;
}

.form-label {
  display: block;
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 6px;
}

input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;
  color: var(--text);
  font-size: 15px;
  outline: none;
  transition: border-color 0.2s;
}

input:focus { border-color: var(--accent); }

.result-box {
  margin-top: 18px;
  background: var(--accent-light);
  border: 1px solid rgba(255, 95, 31, 0.3);
  border-radius: 8px;
  padding: 15px;
  text-align: center;
  display: none;
}

.result-box.show { display: block; }
.food-info-text { font-size: 13px; font-weight: 600; color: var(--text-muted); }
.total-val { font-size: 24px; font-weight: 700; color: var(--accent); margin-top: 5px; }
</style>
</head>
<body>

<div class="container">
  <section class="card">
    <div class="card-title">⚖️ الحاسبة اليدوية المخصصة</div>
    <div class="form-group">
      <label class="form-label">السعرات في كل 100 جرام</label>
      <input type="number" id="manualKcal100" placeholder="مثال: 130" oninput="calculateManual()">
    </div>
    <div class="form-group">
      <label class="form-label">الكمية التي أكلتها (بالجرام)</label>
      <input type="number" id="manualGrams" placeholder="مثال: 200" oninput="calculateManual()">
    </div>
    
    <div class="result-box" id="manualResultBox">
      <div class="food-info-text">إجمالي السعرات للكمية المدخلة:</div>
      <div class="total-val" id="manualTotalKcal">0 سعرة</div>
    </div>
  </section>
</div>

<script>
function calculateManual() {
  const kcal100 = parseFloat(document.getElementById('manualKcal100').value);
  const grams = parseFloat(document.getElementById('manualGrams').value);
  const box = document.getElementById('manualResultBox');

  if (!kcal100 || !grams || kcal100 <= 0 || grams <= 0) {
    box.classList.remove('show');
    return;
  }

  const total = Math.round((kcal100 / 100) * grams);
  document.getElementById('manualTotalKcal').textContent = total + ' سعرة حرارية';
  box.classList.add('show');
}
</script>

</body>
</html>
