<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>قاعدة بيانات السعرات | Coach Anis</title>
<meta name="description" content="قاعدة بيانات غذائية لسعرات وماكرو المكونات — USDA FoodData Central">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

<style>
:root {
  --fire: #FF5F1F;
  --fire2: #FF8C42;
  --gold: #F5C842;
  --gold2: #FFE17A;
  --teal: #00D4AA;
  --teal2: #00F5C4;
  --blue: #4DA6FF;
  --red: #FF4D6D;
  --bg: #06060A;
  --bg2: #0E0E16;
  --bg3: #15151F;
  --bg4: #1C1C28;
  --text: #F0F0F8;
  --muted: #5A5A72;
  --border: rgba(255,255,255,0.06);
  --border-fire: rgba(255,95,31,0.2);
  --border-gold: rgba(245,200,66,0.2);
  --border-teal: rgba(0,212,170,0.2);
  --radius: 18px;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Cairo', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Background Mesh */
body::before {
  content:'';
  position:fixed; inset:0; z-index:0;
  background:
    radial-gradient(ellipse 55% 30% at 15% 0%, rgba(255,95,31,0.06) 0%, transparent 60%),
    radial-gradient(ellipse 45% 25% at 85% 5%, rgba(0,212,170,0.04) 0%, transparent 55%),
    radial-gradient(ellipse 40% 20% at 50% 100%, rgba(245,200,66,0.03) 0%, transparent 50%);
  pointer-events:none;
}

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

/* NAVBAR */
.nav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(6,6,10,0.92);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  display: flex; align-items: center; gap: 14px;
  max-width: 640px; margin: 0 auto;
}

.nav-brand {
  font-family: 'Syne', sans-serif;
  font-size: 1.1rem; font-weight: 800;
  color: var(--text); flex-shrink: 0;
  letter-spacing: -0.5px;
}
.nav-brand span {
  color: var(--muted); font-size: 9px; font-weight: 700;
  letter-spacing: 1.5px; display: block; text-transform: uppercase;
  font-family: 'Cairo', sans-serif; margin-top: 1px;
}

.nav-search {
  flex: 1; min-width: 150px;
  position: relative; display: flex; align-items: center;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 12px; overflow: hidden;
  transition: border-color .2s, box-shadow .2s;
}
.nav-search:focus-within {
  border-color: rgba(255,95,31,0.4);
  box-shadow: 0 0 0 3px rgba(255,95,31,0.08);
}
.nav-search-icon { padding: 0 10px; font-size: 13px; color: var(--muted); }
.nav-search input {
  background: transparent; border: none; outline: none;
  color: var(--text); font-family: 'Cairo', sans-serif;
  font-size: 0.85rem; padding: 10px 0; flex: 1; direction: rtl;
}
.nav-search input::placeholder { color: rgba(255,255,255,0.15); }
.nav-search-clear {
  background: none; border: none; color: var(--muted); cursor: pointer;
  padding: 0 10px; font-size: 13px; display: none; transition: color .2s;
}
.nav-search-clear.show { display: block; }
.nav-search-clear:hover { color: var(--text); }

/* FILTERS BAR */
.filters-bar {
  background: transparent;
  padding: 12px 16px;
  display: flex; gap: 8px; align-items: center;
  overflow-x: auto;
  scrollbar-width: none;
  max-width: 640px; margin: 0 auto;
}
.filters-bar::-webkit-scrollbar { display: none; }
.filter-btn {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 12px; padding: 8px 14px;
  font-family: 'Cairo', sans-serif; font-size: 0.8rem; font-weight: 700;
  color: var(--muted); cursor: pointer; transition: all .25s;
  white-space: nowrap; flex-shrink: 0;
}
.filter-btn:hover { border-color: rgba(255,95,31,0.3); color: var(--text); }
.filter-btn.on {
  background: rgba(255,95,31,0.1);
  border-color: rgba(255,95,31,0.35);
  color: var(--fire2);
  box-shadow: 0 0 20px rgba(255,95,31,0.1);
}

.filters-count {
  margin-right: auto;
  font-family: 'Syne', sans-serif;
  font-size: 11px; font-weight: 700;
  color: var(--muted); letter-spacing: 1px;
}

/* CALCULATOR SECTION */
.calc-section {
  padding: 0 16px 16px;
  max-width: 640px; margin: 0 auto;
}
.calc-card {
  background: var(--bg2);
  border: 1px solid var(--border-fire);
  border-radius: var(--radius); padding: 18px;
  position: relative; overflow: hidden;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}
.calc-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--fire), var(--fire2));
}
.calc-title {
  font-family: 'Syne', sans-serif;
  font-size: 0.95rem; font-weight: 800;
  color: var(--fire2); margin-bottom: 14px;
  letter-spacing: -0.3px;
}
.calc-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.calc-field { flex: 1; min-width: 140px; }
.calc-field label {
  display: block; font-size: 9px; font-weight: 700; color: var(--muted);
  letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 6px;
}
.calc-field select, .calc-field input {
  width: 100%; background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 10px; padding: 11px 12px;
  font-family: 'Syne', sans-serif; font-size: 0.95rem; font-weight: 700;
  color: var(--text); outline: none;
  transition: border-color .2s, box-shadow .2s;
  appearance: none; -webkit-appearance: none;
}
.calc-field select:focus, .calc-field input:focus {
  border-color: rgba(255,95,31,0.5);
  box-shadow: 0 0 0 3px rgba(255,95,31,0.08);
}
.calc-field select option { background: var(--bg3); color: #fff; }

.calc-result {
  margin-top: 14px; display: none;
  animation: fadeUp .3s ease both;
}
.calc-result.show { display: block; }
.calc-result-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
}

.calc-res-cell {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 12px; padding: 12px 8px;
  text-align: center; position: relative; overflow: hidden;
}
.calc-res-cell::before { content: ''; display: block; height: 2px; margin-bottom: 8px; border-radius: 1px; }
.calc-res-cell.k::before { background: var(--fire); }
.calc-res-cell.p::before { background: var(--gold); }
.calc-res-cell.c::before { background: var(--teal); }
.calc-res-cell.f::before { background: var(--blue); }

.calc-res-val {
  font-family: 'Syne', sans-serif;
  font-size: 1.25rem; font-weight: 800; line-height: 1;
  letter-spacing: -0.5px;
}
.calc-res-cell.k .calc-res-val { color: var(--fire2); }
.calc-res-cell.p .calc-res-val { color: var(--gold); }
.calc-res-cell.c .calc-res-val { color: var(--teal2); }
.calc-res-cell.f .calc-res-val { color: var(--blue); }
.calc-res-lbl { font-size: 8px; font-weight: 700; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-top: 4px; }

.calc-food-name { margin-bottom: 10px; font-size: 0.82rem; color: var(--muted); font-weight: 600; }
.calc-food-name strong { color: var(--text); font-size: 0.95rem; font-family: 'Syne', sans-serif; }
.calc-food-tip {
  margin-top: 10px; padding: 10px 12px;
  background: rgba(255,95,31,0.04);
  border: 1px solid var(--border-fire);
  border-radius: 10px; font-size: 0.78rem; color: var(--muted);
  display: none; align-items: center; gap: 8px; font-weight: 600;
}
.calc-food-tip.show { display: flex; }

/* FOOD GRID */
.grid-section { padding: 0 16px 80px; max-width: 640px; margin: 0 auto; }
.section-header {
  display: flex; align-items: center; gap: 10px;
  padding: 16px 0 10px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 12px;
}
.section-label {
  font-family: 'Syne', sans-serif;
  font-size: 0.8rem; font-weight: 800; letter-spacing: 1.5px;
  padding: 5px 12px; border-radius: 20px; text-transform: uppercase;
}
.section-count {
  font-family: 'Syne', sans-serif;
  font-size: 11px; font-weight: 700; color: var(--muted);
  margin-right: auto; letter-spacing: 1px;
}

.food-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-bottom: 16px;
}
@media(max-width:400px) { .food-grid { grid-template-columns: 1fr; } }

.food-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px; overflow: hidden;
  transition: transform .2s, border-color .2s, box-shadow .2s;
  cursor: pointer; position: relative;
}
.food-card:hover {
  transform: translateY(-2px);
  border-color: rgba(255,95,31,0.3);
  box-shadow: 0 6px 24px rgba(255,95,31,0.06);
}
.food-card-top {
  display: flex; justify-content: space-between;
  align-items: flex-start; margin-bottom: 8px;
}
.food-kcal {
  font-family: 'Syne', sans-serif;
  font-size: 1.35rem; font-weight: 800; color: var(--fire2); line-height: 1;
  letter-spacing: -0.5px;
}
.food-kcal-sub { font-size: 8px; font-weight: 700; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
.food-name { font-size: 0.92rem; font-weight: 700; color: var(--text); margin-bottom: 2px; }
.food-name-en { font-size: 0.72rem; color: var(--muted); margin-bottom: 10px; font-weight: 600; }

.food-macros-row {
  display: flex; gap: 8px; font-size: 10px; font-weight: 700; color: var(--muted);
}
.food-macros-row span { font-family: 'Syne', sans-serif; font-size: 11px; }

/* EMPTY STATE */
.empty-state {
  text-align: center; padding: 60px 20px; color: var(--muted);
  display: none; font-weight: 600; font-size: 0.85rem;
}
.empty-state.show { display: block; }
.empty-state div:first-child { font-size: 38px; margin-bottom: 10px; opacity: 0.4; }

/* MODAL */
.modal-overlay {
  position: fixed; inset: 0; z-index: 500;
  background: rgba(6,6,10,0.85);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  display: flex; align-items: center; justify-content: center;
  padding: 16px; opacity: 0; pointer-events: none;
  transition: opacity .3s;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 20px;
  width: 100%; max-width: 380px;
  overflow: hidden;
  transform: scale(.95) translateY(12px);
  transition: transform .3s;
  box-shadow: 0 16px 48px rgba(0,0,0,0.6);
}
.modal-overlay.open .modal-card { transform: scale(1) translateY(0); }
.modal-body { padding: 22px; }
.modal-close {
  float: left; background: none; border: none;
  color: var(--muted); cursor: pointer; font-size: 1rem;
  transition: color .2s;
}
.modal-close:hover { color: var(--text); }
.modal-name { font-size: 1.15rem; font-weight: 800; color: var(--text); margin-bottom: 2px; }
.modal-name-en { font-size: 0.75rem; color: var(--muted); margin-bottom: 16px; font-weight: 600; }
.modal-macros { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 16px; }
.modal-cell { background: var(--bg3); border: 1px solid var(--border); border-radius: 12px; padding: 10px 6px; text-align: center; }
.modal-val { font-family: 'Syne', sans-serif; font-size: 1.15rem; font-weight: 800; line-height: 1; }
.modal-lbl { font-size: 8px; font-weight: 700; color: var(--muted); margin-top: 3px; text-transform: uppercase; }

.modal-calc-input {
  width: 100%; background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 12px;
  font-family: 'Syne', sans-serif; font-size: 0.95rem; font-weight: 700;
  color: var(--text); outline: none; margin-top: 6px;
  transition: border-color .2s;
}
.modal-calc-input:focus { border-color: rgba(255,95,31,0.5); }
.modal-result-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 12px; background: var(--bg3);
  border-radius: 10px; margin-top: 10px; font-size: 0.82rem; font-weight: 600;
}
.modal-result-row.hide { display: none; }

/* TOAST */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--bg4); border: 1px solid var(--border);
  border-radius: 30px; padding: 10px 20px;
  font-size: 0.82rem; color: var(--fire2); font-weight: 700;
  z-index: 800; opacity: 0; transition: all .3s;
  pointer-events: none; white-space: nowrap;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
.food-card { animation: fadeUp .35s ease both; }
</style>
</head>

</div>

 {id:'g16',cat:'grain',name:'أرز بسمتي (جاف)',nameEn:'Basmati Rice (Raw)',kcal:350,prot:7.1,carb:78.0,fat:0.6,note:'أرز بسمتي غير مطبوخ'},
 {id:'g18',cat:'grain',name:'فريكة (جافة)',nameEn:'Freekeh (Dry)',kcal:350,prot:13.0,carb:71.0,fat:2.5,note:'قمح أخضر محمّص جاف'},
 {id:'d03',cat:'dairy',name:'زبادي طبيعي',nameEn:'Yogurt',kcal:59,prot:3.5,carb:5,fat:3.3,note:'بروبيوتيك ممتاز للهضم'},
 {id:'d04',cat:'dairy',name:'زبادي يوناني 0%',nameEn:'Greek Yogurt 0%',kcal:59,prot:10,carb:3.6,fat:0.4,note:'بروتين عالي وسعرات منخفضة'},
 {id:'o01',cat:'fat',name:'زيت زيتون',nameEn:'Olive Oil',kcal:884,prot:0,carb:0,fat:100,note:'دهون أحادية صحية للقلب'},
 {id:'n01',cat:'nut',name:'لوز',nameEn:'Almonds',kcal:579,prot:21.2,carb:21.6,fat:49.9,note:'فيتامين E ومغنيسيوم عالي'},
 {id:'l10',cat:'legume',name:'توفو',nameEn:'Tofu',kcal:76,prot:8.1,carb:1.9,fat:4.8,note:'بروتين نباتي كامل'}
];

const CATS = {
 fruit: {label:'فواكه', color:'#E87A7A'},
 veg: {label:'خضروات', color:'#7AC87A'},
 protein: {label:'بروتينات', color:'#F5C842'},
 grain: {label:'حبوب وكارب', color:'#00D4AA'},
 dairy: {label:'ألبان', color:'#C8C8FF'},
 legume: {label:'بقوليات', color:'#A8C87A'},
 fat: {label:'دهون', color:'#FF5F1F'},
 nut: {label:'مكسرات', color:'#D4A97A'}
};

let activeFilter = 'all';
let searchTerm = '';
let currentModalFood = null;

function init() {
 populateCalcSelect();
 renderGrid();
}

function populateCalcSelect() {
 const sel = document.getElementById('calcSelect');
 FOODS.forEach(f => {
 const op = document.createElement('option');
 op.value = f.id;
 op.textContent = `${f.name} (${f.kcal} kcal)`;
 sel.appendChild(op);
 });
 sel.addEventListener('change', calcResult);
}

function setFilter(btn) {
 document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('on'));
 btn.classList.add('on');
 activeFilter = btn.dataset.cat;
 renderGrid();
}

function handleSearch(val) {
 searchTerm = val.trim().toLowerCase();
 document.getElementById('searchClear').classList.toggle('show', searchTerm.length > 0);
 renderGrid();
}

function clearSearch() {
 document.getElementById('searchInput').value = '';
 searchTerm = '';
 document.getElementById('searchClear').classList.remove('show');
 renderGrid();
}

function renderGrid() {
 const sec = document.getElementById('gridSection');
 const emptyEl = document.getElementById('emptyState');

 let filtered = FOODS.filter(f => {
 const catOk = activeFilter === 'all' || f.cat === activeFilter;
 const searchOk = !searchTerm || f.name.includes(searchTerm) || (f.nameEn && f.nameEn.toLowerCase().includes(searchTerm));
 return catOk && searchOk;
 });

 sec.querySelectorAll('.cat-group').forEach(el => el.remove());

 if (filtered.length === 0) {
 emptyEl.classList.add('show');
 document.getElementById('emptyTerm').textContent = searchTerm || activeFilter;
 document.getElementById('filterCount').textContent = '0 مكوّن';
 return;
 }
 emptyEl.classList.remove('show');
 document.getElementById('filterCount').textContent = filtered.length + ' مكوّن';

 Object.keys(CATS).forEach(cat => {
 const items = filtered.filter(f => f.cat === cat);
 if (items.length === 0) return;

 const group = document.createElement('div');
 group.className = 'cat-group';
 
 const header = document.createElement('div');
 header.className = 'section-header';
 header.innerHTML = `<div class="section-label" style="background:${CATS[cat].color}15;color:${CATS[cat].color}">${CATS[cat].label}</div><div class="section-count">${items.length}</div>`;
 group.appendChild(header);

 const grid = document.createElement('div');
 grid.className = 'food-grid';
 items.forEach(f => grid.appendChild(buildCard(f)));
 group.appendChild(grid);
 sec.appendChild(group);
 });
}

function buildCard(f) {
 const card = document.createElement('div');
 card.className = 'food-card';
 card.onclick = () => openModal(f);
 card.innerHTML = `
 <div class="food-card-top">
 <div>
 <div class="food-name">${f.name}</div>
 <div class="food-name-en">${f.nameEn}</div>
 </div>
 <div style="text-align:left">
 <div class="food-kcal">${f.kcal}</div>
 <div class="food-kcal-sub">KCAL</div>
 </div>
 </div>
 <div class="food-macros-row">
 <span>🥩 ${f.prot}g</span>
 <span>🌾 ${f.carb}g</span>
 <span>🥑 ${f.fat}g</span>
 </div>
 `;
 return card;
}

function calcResult() {
 const selVal = document.getElementById('calcSelect').value;
 const grams = parseFloat(document.getElementById('calcGrams').value);
 const resultEl = document.getElementById('calcResult');

 if (!selVal || !grams || grams <= 0) { resultEl.classList.remove('show'); return; }
 const food = FOODS.find(f => f.id === selVal);
 if (!food) return;

 const ratio = grams / 100;
 document.getElementById('cKcal').textContent = Math.round(food.kcal * ratio);
 document.getElementById('cProt').textContent = (food.prot * ratio).toFixed(1) + 'g';
 document.getElementById('cCarb').textContent = (food.carb * ratio).toFixed(1) + 'g';
 document.getElementById('cFat').textContent = (food.fat * ratio).toFixed(1) + 'g';
 document.getElementById('calcFoodName').innerHTML = `<strong>${food.name}</strong> — ${grams}g`;
 
 const tipEl = document.getElementById('calcFoodTip');
 if (food.note) { tipEl.textContent = food.note; tipEl.classList.add('show'); }
 else { tipEl.classList.remove('show'); }
 resultEl.classList.add('show');
}

function openModal(f) {
 currentModalFood = f;
 document.getElementById('mName').textContent = f.name;
 document.getElementById('mNameEn').textContent = f.nameEn;
 document.getElementById('mKcal').textContent = f.kcal;
 document.getElementById('mProt').textContent = f.prot + 'g';
 document.getElementById('mCarb').textContent = f.carb + 'g';
 document.getElementById('mFat').textContent = f.fat + 'g';
 document.getElementById('modalGrams').value = '';
 document.getElementById('modalResultRow').classList.add('hide');
 document.getElementById('modal').classList.add('open');
}

function closeModal(e) {
 if (e && e.target !== document.getElementById('modal') && !e.target.classList.contains('modal-close')) return;
 document.getElementById('modal').classList.remove('open');
}

function modalCalc() {
 const g = parseFloat(document.getElementById('modalGrams').value);
 if (!g || g <= 0 || !currentModalFood) return;
 const f = currentModalFood;
 const r = g / 100;
 const row = document.getElementById('modalResultRow');
 document.getElementById('modalResText').textContent = `${g}g: بروتين ${(f.prot*r).toFixed(1)}g · كارب ${(f.carb*r).toFixed(1)}g · دهون ${(f.fat*r).toFixed(1)}g`;
 document.getElementById('modalResKcal').textContent = Math.round(f.kcal * r) + ' kcal';
 row.classList.remove('hide');
}

init();
</script>
</body>
</html>
